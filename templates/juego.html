<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Contador de Palabras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Contador de Palabras</h1>
            <p>Categoría: {{ categoria }}</p>
        </header>

        <section class="juego-section">
            <div class="tiempo-container">
                <div id="tiempo">60</div>
            </div>

            <div class="input-container">
                <input type="text" id="palabra-input" placeholder="Escribe una palabra..." autofocus>
            </div>

            <div class="palabras-container">
                <h3>Palabras ingresadas:</h3>
                <ul id="lista-palabras"></ul>
            </div>
        </section>

        <div id="verificacion-section" class="verificacion-section hidden">
            <h2>Verifica tus palabras</h2>
            <p>Marca las palabras que son válidas para esta categoría</p>
            <ul id="verificacion-palabras"></ul>
            <div class="botones-final">
                <button id="btn-verificar" class="btn btn-primary">Verificar</button>
            </div>
        </div>

        <div id="resultado-section" class="resultado-section hidden">
            <h2>¡Juego terminado!</h2>
            <p>Tu puntuación: <span id="puntuacion-final">0</span> palabras</p>
            
            <div class="usuario-input">
                <label for="nombre-usuario">Ingresa tu nombre para guardar tu puntuación:</label>
                <input type="text" id="nombre-usuario" placeholder="Tu nombre">
            </div>

            <div class="botones-final">
                <button id="btn-guardar" class="btn btn-primary">Guardar</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver al inicio</a>
            </div>

            <div id="resultado-ranking" class="hidden">
                <h3>Top 10</h3>
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>Posición</th>
                            <th>Jugador</th>
                            <th>Puntuación</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let tiempo = 60;
        let palabras = [];
        let timer;
        const palabraInput = document.getElementById('palabra-input');
        const listaPalabras = document.getElementById('lista-palabras');
        const verificacionSection = document.getElementById('verificacion-section');
        const resultadoSection = document.getElementById('resultado-section');
        const puntuacionFinal = document.getElementById('puntuacion-final');
        const nombreUsuario = document.getElementById('nombre-usuario');
        const btnVerificar = document.getElementById('btn-verificar');
        const btnGuardar = document.getElementById('btn-guardar');
        const rankingTbody = document.getElementById('ranking-tbody');

        function actualizarTiempo() {
            const tiempoElement = document.getElementById('tiempo');
            tiempoElement.textContent = tiempo;
            
            if (tiempo <= 0) {
                clearInterval(timer);
                terminarJuego();
            }
            tiempo--;
        }

        function agregarPalabra() {
            const palabra = palabraInput.value.trim().toLowerCase();
            if (palabra && !palabras.includes(palabra)) {
                palabras.push(palabra);
                const li = document.createElement('li');
                li.textContent = palabra;
                listaPalabras.appendChild(li);
                palabraInput.value = '';
            }
        }

        function terminarJuego() {
            palabraInput.disabled = true;
            mostrarVerificacion();
        }

        function mostrarVerificacion() {
            const verificacionPalabras = document.getElementById('verificacion-palabras');
            verificacionPalabras.innerHTML = '';
            
            palabras.forEach(palabra => {
                const li = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = true;
                checkbox.dataset.palabra = palabra;
                
                const span = document.createElement('span');
                span.textContent = palabra;
                
                li.appendChild(checkbox);
                li.appendChild(span);
                verificacionPalabras.appendChild(li);
            });
            
            verificacionSection.classList.remove('hidden');
        }

        function mostrarResultado(palabrasValidas) {
            verificacionSection.classList.add('hidden');
            resultadoSection.classList.remove('hidden');
            puntuacionFinal.textContent = palabrasValidas.length;
        }

        function guardarPuntuacion() {
            const nombre = nombreUsuario.value.trim();
            if (!nombre) {
                alert('Por favor, ingresa tu nombre');
                return;
            }

            fetch('/guardar_puntuacion', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    nombre: nombre,
                    puntuacion: palabras.length,
                    categoria: '{{ categoria }}'
                })
            })
            .then(response => response.json())
            .then(data => {
                mostrarRanking(data.ranking);
                btnGuardar.disabled = true;
            });
        }

        function mostrarRanking(ranking) {
            const resultadoRanking = document.getElementById('resultado-ranking');
            rankingTbody.innerHTML = '';
            
            ranking.slice(0, 10).forEach((jugador, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${jugador.nombre}</td>
                    <td>${jugador.puntuacion}</td>
                `;
                rankingTbody.appendChild(tr);
            });
            
            resultadoRanking.classList.remove('hidden');
        }

        palabraInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                agregarPalabra();
            }
        });

        btnVerificar.addEventListener('click', () => {
            const palabrasValidas = Array.from(document.querySelectorAll('#verificacion-palabras input[type="checkbox"]:checked'))
                .map(checkbox => checkbox.dataset.palabra);
            mostrarResultado(palabrasValidas);
        });

        btnGuardar.addEventListener('click', guardarPuntuacion);

        // Iniciar el juego
        timer = setInterval(actualizarTiempo, 1000);
    </script>
</body>
</html>
